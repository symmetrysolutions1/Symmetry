name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Solidity build
        run: pnpm contracts:build

      - name: Solidity format
        run: pnpm contracts:fmt:check

      - name: Deployable contract sizes
        run: pnpm contracts:sizes

      - name: Solidity compile check
        run: pnpm contracts:check

      - name: Foundry tests
        run: pnpm contracts:test

      - name: Evidence canonicalization tests
        run: pnpm test:evidence

      - name: TypeScript build
        run: pnpm build

      - name: Backend service tests
        run: pnpm test:backend

      - name: TypeScript lint
        run: pnpm lint

      - name: Readiness check
        run: pnpm readiness:check
